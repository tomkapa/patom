name: release

# Runs only after `ci` succeeds on main. Using workflow_run (not push) means:
#  - deploy never happens on red tests;
#  - the tag-bump commit below is pushed with GITHUB_TOKEN, which by design does
#    NOT trigger further workflow runs — so there is no build loop.
on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]

permissions:
  contents: read    # checkout only; the tag bump now lands in patom-infra (cross-repo)
  packages: write   # push to GHCR

# Serialize releases so two workflow_run completions can't race on the cross-repo push.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - id: vars
        # On workflow_run, GITHUB_SHA is the default-branch HEAD, NOT the built
        # commit — derive the tag from the triggering run's head_sha so the image
        # tag and the Helm bump point at exactly what CI tested.
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "sha=${HEAD_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/tomkapa/patom:${{ steps.vars.outputs.sha }}
            ghcr.io/tomkapa/patom:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push backup image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/backup.Dockerfile
          push: true
          tags: |
            ghcr.io/tomkapa/patom-backup:${{ steps.vars.outputs.sha }}
            ghcr.io/tomkapa/patom-backup:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pin image tags in patom-infra ArgoCD apps
        # The chart's own values.yaml now carries a STABLE, customer-facing pinned
        # tag (issue #85) — CI must not clobber it. SaaS continuous-deploy instead
        # floats to this build by rewriting the `image.tag` / `backup.imageTag`
        # Helm parameters on the ArgoCD Applications in patom-infra; ArgoCD's
        # app-of-apps tracks that repo's HEAD and syncs the new tag.
        env:
          SHA: ${{ steps.vars.outputs.sha }}
          # Fine-grained PAT with contents:write on tomkapa/patom-infra. The
          # built-in GITHUB_TOKEN is scoped to THIS repo and cannot push cross-repo.
          INFRA_REPO_TOKEN: ${{ secrets.INFRA_REPO_TOKEN }}
        run: |
          set -euo pipefail
          # yq isn't preinstalled on ubuntu-latest; grab the static binary.
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          git clone --depth 1 \
            "https://x-access-token:${INFRA_REPO_TOKEN}@github.com/tomkapa/patom-infra.git" \
            infra
          cd infra
          app=kubernetes/apps/patom.yaml
          pg=kubernetes/apps/postgres.yaml
          # Rewrite the value of the pre-seeded CI-managed params in place. yq
          # selects the param by name, so unrelated params (e.g. externalSecret.enabled)
          # are untouched.
          yq -i '(.spec.source.helm.parameters[] | select(.name == "image.tag") | .value) = strenv(SHA)' "$app"
          yq -i '(.spec.source.helm.parameters[] | select(.name == "backup.imageTag") | .value) = strenv(SHA)' "$pg"
          if git diff --quiet -- "$app" "$pg"; then
            echo "params already ${SHA}; nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$app" "$pg"
          git commit -m "deploy(patom): image ${SHA}"
          git push origin HEAD:main
