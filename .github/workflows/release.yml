name: release

# Runs only after `ci` succeeds on main. Using workflow_run (not push) means:
#  - deploy never happens on red tests;
#  - the tag-bump commit below is pushed with GITHUB_TOKEN, which by design does
#    NOT trigger further workflow runs — so there is no build loop.
on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]

permissions:
  contents: write   # commit the image-tag bump
  packages: write   # push to GHCR

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - id: vars
        run: echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/tomkapa/patom:${{ steps.vars.outputs.sha }}
            ghcr.io/tomkapa/patom:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push backup image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/backup.Dockerfile
          push: true
          tags: |
            ghcr.io/tomkapa/patom-backup:${{ steps.vars.outputs.sha }}
            ghcr.io/tomkapa/patom-backup:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Bump image tag in Helm values
        env:
          SHA: ${{ steps.vars.outputs.sha }}
        run: |
          set -euo pipefail
          file=deploy/helm/patom/values.yaml
          # yq isn't preinstalled on ubuntu-latest; grab the static binary.
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq -i '.image.tag = strenv(SHA)' "$file"
          if git diff --quiet -- "$file"; then
            echo "image tag already ${SHA}; nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$file"
          git commit -m "deploy(patom): image ${SHA} [skip ci]"
          git push origin HEAD:main
