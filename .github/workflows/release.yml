name: release

# Runs only after `ci` succeeds on main. Using workflow_run (not push) means:
#  - deploy never happens on red tests;
#  - the tag-bump commit below is pushed with GITHUB_TOKEN, which by design does
#    NOT trigger further workflow runs — so there is no build loop.
on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]

permissions:
  contents: write   # commit the image-tag bump
  packages: write   # push to GHCR

# Serialize releases so two workflow_run completions can't race on the push to main.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - id: vars
        # On workflow_run, GITHUB_SHA is the default-branch HEAD, NOT the built
        # commit — derive the tag from the triggering run's head_sha so the image
        # tag and the Helm bump point at exactly what CI tested.
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "sha=${HEAD_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/tomkapa/patom:${{ steps.vars.outputs.sha }}
            ghcr.io/tomkapa/patom:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push backup image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/backup.Dockerfile
          push: true
          tags: |
            ghcr.io/tomkapa/patom-backup:${{ steps.vars.outputs.sha }}
            ghcr.io/tomkapa/patom-backup:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Bump image tags in Helm values
        env:
          SHA: ${{ steps.vars.outputs.sha }}
        run: |
          set -euo pipefail
          app=deploy/helm/patom/values.yaml
          pg=deploy/helm/postgres/values.yaml
          # yq isn't preinstalled on ubuntu-latest; grab the static binary.
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          # Commit onto the CURRENT main tip (not the detached head_sha we built
          # from) so the push is always fast-forward; the concurrency group keeps
          # runs serialized.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          yq -i '.image.tag = strenv(SHA)' "$app"
          yq -i '.backup.imageTag = strenv(SHA)' "$pg"
          if git diff --quiet -- "$app" "$pg"; then
            echo "tags already ${SHA}; nothing to commit"
            exit 0
          fi
          git add "$app" "$pg"
          git commit -m "deploy(patom): image ${SHA} [skip ci]"
          git push origin main
