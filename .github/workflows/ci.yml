name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: every job only reads the repo (checkout). No job writes
# contents, posts statuses, or needs the token for anything else.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Warnings are errors everywhere (CLAUDE.md §7).
  RUSTFLAGS: "-D warnings"

jobs:
  # ── Lint gates that need no database ────────────────────────────────────
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # ── Test suite against a real Postgres (CLAUDE.md §3) ───────────────────
  test:
    name: test (sqlx)
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector image: the `vector` + `citext` extensions the migrations
        # enable are available out of the box. `#[sqlx::test]` creates a fresh
        # database per test (default search_path = public), so migration 1's
        # `CREATE EXTENSION` self-provisions every test DB — no init script.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: patom
          POSTGRES_PASSWORD: patom
          POSTGRES_DB: patom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U patom -d patom"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      # `#[sqlx::test]` reads this to create per-test databases under the
      # service container.
      DATABASE_URL: postgres://patom:patom@localhost:5432/patom
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Roles are cluster-global, so the tenancy migration's CREATE ROLE races
      # when `#[sqlx::test]` migrates many fresh DBs concurrently. Provision the
      # role once per cluster up front so that guard always skips. See
      # ci/init-roles.sql for the full rationale.
      - name: provision cluster-global role
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ci/init-roles.sql
      - name: cargo test
        run: cargo test --all-features

  # ── Forward + reverse migration round-trip (CLAUDE.md §14) ──────────────
  migrations:
    name: migration round-trip
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: patom
          POSTGRES_PASSWORD: patom
          POSTGRES_DB: patom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U patom -d patom"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      DATABASE_URL: postgres://patom:patom@localhost:5432/patom
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres,rustls --locked
      - name: up → revert-all → up (proves every .down.sql reverses)
        run: |
          set -uo pipefail
          sqlx migrate run
          # `revert` undoes one step; loop until none remain. Migration 1 is an
          # irreversible init (no .down.sql), so revert stops there with
          # "No migrations available to revert" — that is the expected floor,
          # not a failure. Any non-zero exit before that is a broken .down.sql.
          # 100 is a safe cap over the 52 migrations (§5).
          for _ in $(seq 1 100); do
            out=$(sqlx migrate revert 2>&1); rc=$?
            echo "$out"
            if echo "$out" | grep -q "No migrations available to revert"; then
              break
            fi
            if [ "$rc" -ne 0 ]; then
              echo "::error::a .down.sql failed to reverse"
              exit 1
            fi
          done
          sqlx migrate run

  # ── Supply-chain gates (CLAUDE.md §8) ───────────────────────────────────
  # cargo-deny: licenses + advisories + bans + sources, configured by deny.toml.
  # cargo-audit: lockfile advisory scan (superset of deny's build-graph scan),
  # configured by .cargo/audit.toml. Both ignore lists carry per-ID rationale.
  supply-chain:
    name: deny + audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      # Prebuilt binary — avoids a multi-minute `cargo install` compile.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit

  # ── sqlx offline cache drift-guard ──────────────────────────────────────
  # The container image builds with SQLX_OFFLINE=true (no DB). If anyone adds or
  # changes a compile-time query!/query_as! macro without committing the regenerated
  # .sqlx cache, `prepare --check` fails here — before the image build would break.
  sqlx-offline:
    name: sqlx offline check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: patom
          POSTGRES_PASSWORD: patom
          POSTGRES_DB: patom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U patom -d patom"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      DATABASE_URL: postgres://patom:patom@localhost:5432/patom
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli
      - name: apply migrations (so macros can typecheck against the schema)
        run: sqlx migrate run
      - name: verify committed .sqlx is in sync
        run: cargo sqlx prepare --check

  # ── Frontend: typecheck + production build (the SPA baked into the image) ─
  web:
    name: web typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: bun install
        working-directory: web
        run: bun install --frozen-lockfile
      - name: typecheck
        working-directory: web
        run: bun run typecheck
      - name: build
        working-directory: web
        run: bun run build
