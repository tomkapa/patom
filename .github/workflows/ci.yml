name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: every job only reads the repo (checkout). No job writes
# contents, posts statuses, or needs the token for anything else.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Warnings are errors everywhere (CLAUDE.md §7).
  RUSTFLAGS: "-D warnings"

jobs:
  # ── Lint gates that need no database ────────────────────────────────────
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      # Open-core boundary (#133): the default build must NOT link patom-cloud.
      # patom-cloud is an optional dep behind the `cloud` feature; if it ever
      # shows up in the default dependency graph, paid code has leaked into the
      # OSS / self-host binary.
      - name: open-core boundary (patom-cloud excluded from default build)
        run: |
          set -euo pipefail
          if cargo tree -p patom-server -e normal | grep -q patom-cloud; then
            echo "::error::patom-cloud leaked into the default (OSS) binary"
            exit 1
          fi
          # Positive control: patom-cloud MUST appear with --features cloud. Without
          # this, a rename or a broken grep would make the check above pass vacuously.
          if ! cargo tree -p patom-server --features cloud -e normal | grep -q patom-cloud; then
            echo "::error::open-core guard is stale: patom-cloud not linked even with --features cloud"
            exit 1
          fi
          echo "ok: patom-cloud absent by default, present under --features cloud"

  # ── Test suite against a real Postgres (CLAUDE.md §3) ───────────────────
  test:
    name: test (sqlx)
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector image: the `vector` + `citext` extensions the migrations
        # enable are available out of the box. `#[sqlx::test]` creates a fresh
        # database per test (default search_path = public), so migration 1's
        # `CREATE EXTENSION` self-provisions every test DB — no init script.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: patom
          POSTGRES_PASSWORD: patom
          POSTGRES_DB: patom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U patom -d patom"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      # `#[sqlx::test]` reads this to create per-test databases under the
      # service container.
      DATABASE_URL: postgres://patom:patom@localhost:5432/patom
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Roles are cluster-global, so the tenancy migration's CREATE ROLE races
      # when `#[sqlx::test]` migrates many fresh DBs concurrently. Provision the
      # role once per cluster up front so that guard always skips. See
      # ci/init-roles.sql for the full rationale.
      - name: provision cluster-global role
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ci/init-roles.sql
      - name: cargo test
        run: cargo test --all-features

  # ── Forward + reverse migration round-trip (CLAUDE.md §14) ──────────────
  migrations:
    name: migration round-trip
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: patom
          POSTGRES_PASSWORD: patom
          POSTGRES_DB: patom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U patom -d patom"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      DATABASE_URL: postgres://patom:patom@localhost:5432/patom
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres,rustls --locked
      - name: up → revert-all → up (proves every .down.sql reverses)
        run: |
          set -uo pipefail
          # Migrations live in the patom-core crate after the workspace split (#133).
          SRC=crates/patom-core/migrations
          sqlx migrate run --source "$SRC"
          # `revert` undoes one step; loop until none remain. Migration 1 is an
          # irreversible init (no .down.sql), so revert stops there with
          # "No migrations available to revert" — that is the expected floor,
          # not a failure. Any non-zero exit before that is a broken .down.sql.
          # 100 is a safe cap over the 52 migrations (§5).
          for _ in $(seq 1 100); do
            out=$(sqlx migrate revert --source "$SRC" 2>&1); rc=$?
            echo "$out"
            if echo "$out" | grep -q "No migrations available to revert"; then
              break
            fi
            if [ "$rc" -ne 0 ]; then
              echo "::error::a .down.sql failed to reverse"
              exit 1
            fi
          done
          sqlx migrate run --source "$SRC"

  # ── Supply-chain gates (CLAUDE.md §8) ───────────────────────────────────
  # cargo-deny: licenses + advisories + bans + sources, configured by deny.toml.
  # cargo-audit: lockfile advisory scan (superset of deny's build-graph scan),
  # configured by .cargo/audit.toml. Both ignore lists carry per-ID rationale.
  supply-chain:
    name: deny + audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      # Prebuilt binary — avoids a multi-minute `cargo install` compile.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit

  # ── Frontend: typecheck + production build (the SPA baked into the image) ─
  web:
    name: web typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: bun install
        working-directory: web
        run: bun install --frozen-lockfile
      - name: typecheck
        working-directory: web
        run: bun run typecheck
      - name: build
        working-directory: web
        run: bun run build

  # ── Helm chart: lint + render gate (CLAUDE.md §3) ───────────────────────
  # Asserts the bundled standalone `postgresql` subchart renders when enabled
  # (default self-host mode) and disappears when disabled (managed/external DB),
  # and that it carries no SaaS-internal coupling. See ci/helm-test.sh.
  chart:
    name: helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: helm lint + render
        run: ./ci/helm-test.sh
