# Plain Kubernetes Secret path for self-hosted installs (issue #84): supply the
# `patom-config` Secret directly from values, with no External Secrets Operator
# or OpenBao CRDs in the cluster. Mutually exclusive with externalSecret.enabled.
# When argocd.syncWaves is on (SaaS/ArgoCD installs), sync-wave -1 makes this
# Secret exist before the Deployment (wave 0); off by default for plain installs.
{{- if and .Values.externalSecret.enabled .Values.secret.create }}
{{- fail "externalSecret.enabled and secret.create are mutually exclusive: both manage the patom-config Secret" }}
{{- end }}
{{- if and (not .Values.externalSecret.enabled) (not .Values.secret.create) }}
{{- fail "set exactly one of externalSecret.enabled or secret.create to supply the patom-config Secret" }}
{{- end }}
{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: patom-config
  {{- if .Values.argocd.syncWaves }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  {{- end }}
  labels:
    {{- include "patom.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secret.data }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
