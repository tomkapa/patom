apiVersion: apps/v1
kind: Deployment
metadata:
  name: patom
  annotations:
    # stakater/reloader watches the envFrom secretRef (patom-config) and
    # rolling-restarts this Deployment whenever its contents change — so an
    # OpenBao secret rotation goes live without a manual `kubectl rollout
    # restart`. No-op if the reloader controller isn't installed.
    reloader.stakater.com/auto: "true"
  labels:
    {{- include "patom.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Single 4 GB node: avoid two app pods (2× RAM) overlapping during a rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "patom.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "patom.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: patom
      automountServiceAccountToken: false   # app doesn't call the k8s API
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: patom
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          # Non-secret config from values; secret config from the ESO-synced Secret.
          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: patom-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Listener binds only AFTER 103 migrations run; until then the port
          # refuses connections, so startupProbe must be generous.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # readOnlyRootFilesystem: give the process a writable scratch dir
            # (otel/sqlx may buffer to a temp path).
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
