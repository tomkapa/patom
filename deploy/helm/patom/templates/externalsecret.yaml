# Materialises the `patom-config` Secret from OpenBao via External Secrets.
# sync-wave -1: the Secret must exist before the Deployment (wave 0) starts.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: patom-config
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    {{- include "patom.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecret.storeRef }}
    kind: ClusterSecretStore
  target:
    name: patom-config
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.externalSecret.remoteKey }}
