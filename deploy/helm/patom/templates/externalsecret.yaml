# Materialises the `patom-config` Secret from OpenBao via External Secrets.
# sync-wave -1: the Secret must exist before the Deployment (wave 0) starts.
# Opt-in (issue #84): requires the External Secrets Operator + a `vault-backend`
# ClusterSecretStore. Self-hosted installs leave this off and use the plain
# Secret path (secret.create) instead — see templates/secret.yaml.
{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: patom-config
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    {{- include "patom.labels" . | nindent 4 }}
spec:
  # 1m so an OpenBao change lands in the patom-config Secret within a
  # minute, instead of leaving the app on stale creds for up to an hour
  # (paired with stakater/reloader, which restarts the Deployment on the
  # resulting Secret change — so secret rotation is hands-off).
  refreshInterval: 1m
  secretStoreRef:
    name: {{ .Values.externalSecret.storeRef }}
    kind: ClusterSecretStore
  target:
    name: patom-config
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.externalSecret.remoteKey }}
{{- end }}
