# Patom app chart values. The image.tag is rewritten by CI on every push to main
# (see .github/workflows/release.yml); ArgoCD syncs the change.
image:
  repository: ghcr.io/tomkapa/patom
  tag: bd8840814367 # CI-managed
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: ghcr-pull-secret
replicaCount: 1
service:
  port: 8080
ingress:
  enabled: true
  className: nginx
  # The app + API now live on the `app.` subdomain; the apex (patom.app)
  # serves the static marketing site (separate repo / host). cert-manager
  # re-issues `patom-tls` for this host on sync. See the marketing
  # subdomain-split cutover plan.
  host: app.patom.app
  clusterIssuer: letsencrypt-prod # cert-manager ClusterIssuer (DNS-01)
  tlsSecretName: patom-tls
  proxyBodySize: "8m" # app limit is 4 MiB; headroom for multipart
# External Secret: the whole config lives at this OpenBao KV path and is pulled
# verbatim into the `patom-config` Secret via dataFrom.extract — so adding a new
# secret key needs no chart change, only an OpenBao write.
externalSecret:
  storeRef: vault-backend
  remoteKey: secret/data/patom/config
# Non-secret env (secret env comes from the patom-config Secret via envFrom).
env:
  HTTP_ADDR: "0.0.0.0:8080"
  PATOM_WEB_DIST: "/app/web/dist"
  MODEL: "deepseek-v4-flash"
  EMBEDDING_DIMENSIONS: "1536"
  EMBEDDING_MODEL: "text-embedding-3-small"
  EMBEDDING_BASE_URL: "https://api.openai.com/v1"
  DEEPSEEK_BASE_URL: "https://api.deepseek.com"
  PATOM_COOKIE_SECURE: "true"
  PATOM_OAUTH_REDIRECT_BASE: "https://app.patom.app"
  PATOM_WEB_BASE_URL: "https://app.patom.app"
  # Shared cookie Domain so the session + CSRF cookies issued by
  # app.patom.app are visible to the apex marketing site (same registrable
  # domain → SameSite=Lax still applies). Empty/unset would keep cookies
  # host-only and the landing page could not read the logged-in state.
  PATOM_COOKIE_DOMAIN: ".patom.app"
  # CORS allowlist so the marketing apex can read app.patom.app/api/me with
  # credentials. Credentialed CORS forbids a wildcard, so this is explicit.
  PATOM_CORS_ALLOWED_ORIGINS: "https://patom.app"
  PATOM_R2_PUBLIC_HOST: "https://asset.patom.app"
  PATOM_R2_BUCKET: "patom"
  PATOM_GENAI_CAPTURE_CONTENT: 1
resources:
  requests:
    cpu: 150m
    memory: 320Mi
  limits:
    memory: 768Mi
# Cold start runs 103 sqlx migrations before the listener binds; startupProbe
# must cover that or liveness kills the pod mid-migration.
probes:
  startup:
    failureThreshold: 60 # x5s = 300s budget
    periodSeconds: 5
  liveness:
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    periodSeconds: 10
    failureThreshold: 6
# Namespace-level quota (co-located with the app; platform onboarding doesn't
# need a separate step). Sized for app + Postgres + backup job on the 4 GB node.
resourceQuota:
  enabled: true
  hard:
    requests.cpu: 1
    requests.memory: 1536Mi
    limits.memory: 3Gi
    count/pods: "8"
# Postgres coordinates (the StatefulSet lives in the sibling `postgres` chart).
postgres:
  serviceName: patom-postgres
  port: 5432
