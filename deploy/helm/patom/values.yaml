# Patom app chart values. This is the stable, customer-facing default: it pins a
# specific image tag and pulls anonymously from the public GHCR package — no
# registry credentials required (issue #85). CI no longer rewrites image.tag here;
# SaaS continuous-deploy floats to the latest main build via the ArgoCD
# Application's Helm `image.tag` parameter instead (patom-infra
# kubernetes/apps/patom.yaml). See doc/operations/self-hosting.md.
image:
  repository: ghcr.io/tomkapa/patom
  # Pinned release tag. Bumped by hand at chart-release time (NOT by CI). To
  # mirror into a private/air-gap registry, override image.repository (and set
  # imagePullSecrets below). Do not deploy `:latest` in production.
  tag: 5fea278ff98c
  pullPolicy: IfNotPresent
# Empty by default: the public GHCR image needs no pull secret. Set this only
# when mirroring into a private registry, e.g.
#   --set-json 'imagePullSecrets=[{"name":"my-registry-cred"}]'
imagePullSecrets: []
replicaCount: 1
service:
  port: 8080
# Ingress is keyed off a single customer domain (`host`): the app, API, and SPA
# are all served from it, and PATOM_OAUTH_REDIRECT_BASE / PATOM_WEB_BASE_URL are
# derived as https://<host> (see templates/deployment.yaml). Set `host` to your
# domain and point a DNS record at your ingress controller. See
# doc/operations/self-hosting.md for DNS + TLS prerequisites.
ingress:
  enabled: true
  className: nginx
  host: patom.example.com # ← your domain (the single value to set)
  tls:
    # How TLS for `host` is obtained:
    #   cert-manager    — cert-manager issues + renews into `secretName` via
    #                     `clusterIssuer` (requires cert-manager + a ClusterIssuer).
    #   existing-secret — you pre-create a kubernetes.io/tls Secret named
    #                     `secretName` (no cert-manager needed).
    #   none            — TLS terminated upstream (cloud LB / edge); no tls block,
    #                     ssl-redirect disabled.
    mode: cert-manager
    clusterIssuer: letsencrypt-prod # used when mode=cert-manager
    secretName: patom-tls # cert-manager writes here, or your existing TLS Secret
  # Extra ingress annotations (e.g. for a non-nginx controller). Merged verbatim.
  annotations: {}
  proxyBodySize: "8m" # app limit is 4 MiB; headroom for multipart
# External Secret (opt-in): the whole config lives at this OpenBao KV path and is
# pulled verbatim into the `patom-config` Secret via dataFrom.extract — so adding
# a new secret key needs no chart change, only an OpenBao write. Off by default
# (issue #84) so self-hosted clusters without the External Secrets Operator can
# render; SaaS prod re-enables it via the ArgoCD Application's Helm parameter
# (patom-infra kubernetes/apps/patom.yaml). Mutually exclusive with `secret.create`.
externalSecret:
  enabled: false
  storeRef: vault-backend
  remoteKey: secret/data/patom/config
# Plain Kubernetes Secret path for self-hosted installs (no ESO/OpenBao required).
# Mutually exclusive with externalSecret.enabled; exactly one of the two must be
# set. Keys under secret.data become container env via the Deployment's envFrom.
# See values.example.yaml for the full key list.
secret:
  create: false
  data: {}
# Public origin behaviour, derived from the single customer domain (ingress.host).
# Defaults are single-origin: app + API + SPA on one host, host-only cookies, no
# CORS. The cross-subdomain cookie/CORS split is cloud-specific (marketing apex on
# a sibling host) — opt into it only if you split the app across hostnames.
app:
  # Browser-facing origin. Empty → https://<ingress.host>. Set only when an
  # external LB/proxy exposes a public hostname different from ingress.host.
  publicUrl: ""
  # Cross-subdomain cookie Domain (e.g. ".example.com") so cookies set by the app
  # host are readable on a sibling host. Empty → host-only (single-origin).
  cookieDomain: ""
  # Extra browser origins allowed to call the API with credentials (CORS), e.g.
  # ["https://www.example.com"]. Empty → no CORS layer (same-origin only).
  corsAllowedOrigins: []
# Non-secret env (secret env comes from the patom-config Secret via envFrom).
# PATOM_OAUTH_REDIRECT_BASE / PATOM_WEB_BASE_URL / PATOM_COOKIE_DOMAIN /
# PATOM_CORS_ALLOWED_ORIGINS are NOT set here — they derive from ingress.host and
# the `app` block above (templates/deployment.yaml).
env:
  HTTP_ADDR: "0.0.0.0:8080"
  PATOM_WEB_DIST: "/app/web/dist"
  MODEL: "deepseek-v4-flash"
  EMBEDDING_DIMENSIONS: "1536"
  EMBEDDING_MODEL: "text-embedding-3-small"
  EMBEDDING_BASE_URL: "https://api.openai.com/v1"
  DEEPSEEK_BASE_URL: "https://api.deepseek.com"
  PATOM_COOKIE_SECURE: "true"
  # S3-compatible object storage (generic — MinIO / AWS / R2). The
  # endpoint embeds the R2 account id, so it stays in the secret store
  # (`PATOM_S3_ENDPOINT=https://<account_id>.r2.cloudflarestorage.com`)
  # alongside the credentials (`PATOM_S3_ACCESS_KEY_ID`,
  # `PATOM_S3_SECRET_ACCESS_KEY`), materialised by the ExternalSecret.
  # Bucket, region, and public host are non-sensitive and live here.
  PATOM_S3_PUBLIC_HOST: "https://asset.patom.app"
  PATOM_S3_BUCKET: "patom"
  PATOM_S3_REGION: "auto"
  # Secure-by-default (issue #88): 0 keeps prompt/response content on-box — it is
  # never recorded onto spans or stderr, so a fresh self-host install captures no
  # prompt content regardless of which (if any) OTLP backend is configured. SaaS
  # prod re-enables capture by overriding this to 1 via the ArgoCD Application's
  # Helm parameter (patom-infra kubernetes/apps/patom.yaml), same float pattern as
  # `externalSecret` above. See doc/operations/self-hosting.md.
  PATOM_GENAI_CAPTURE_CONTENT: 0
resources:
  requests:
    cpu: 150m
    memory: 320Mi
  limits:
    memory: 768Mi
# Cold start runs 103 sqlx migrations before the listener binds; startupProbe
# must cover that or liveness kills the pod mid-migration.
probes:
  startup:
    failureThreshold: 60 # x5s = 300s budget
    periodSeconds: 5
  liveness:
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    periodSeconds: 10
    failureThreshold: 6
# Namespace-level quota (co-located with the app; platform onboarding doesn't
# need a separate step). Sized for app + Postgres + backup job on the 4 GB node.
resourceQuota:
  enabled: true
  hard:
    requests.cpu: 1
    requests.memory: 1536Mi
    limits.memory: 3Gi
    count/pods: "8"
# Postgres coordinates (the StatefulSet lives in the sibling `postgres` chart).
postgres:
  serviceName: patom-postgres
  port: 5432
