# Defaults for the bundled standalone Postgres subchart. The parent patom chart
# surfaces the commonly-set knobs under its own `postgresql:` block (the customer
# entry point); these are the fallback defaults. Gated by `postgresql.enabled`
# (the dependency condition in the parent Chart.yaml).
image: pgvector/pgvector:pg17

auth:
  username: patom
  database: patom
  # REQUIRED when enabled. Must match the password embedded in DATABASE_URL
  # (patom-config Secret). Empty fails the render with a clear message.
  password: ""

persistence:
  size: 10Gi
  # "" → use the cluster's default StorageClass. Set to a specific class if your
  # cluster has no default or you want a particular one.
  storageClass: ""

# Pinned so PG doesn't auto-reserve more than a small node can spare; matches the
# app's PgPool (max 32 connections, hardcoded).
config:
  sharedBuffers: 128MB
  maxConnections: "50"
  workMem: 4MB

service:
  # Stable DNS name used as the DATABASE_URL host (postgres://patom@patom-postgres).
  name: patom-postgres
  port: 5432

resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    memory: 768Mi
