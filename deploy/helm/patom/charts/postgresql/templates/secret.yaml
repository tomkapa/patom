{{- if not .Values.auth.password }}
{{- fail "postgresql.auth.password is required when postgresql.enabled=true — it must match the password in DATABASE_URL. Set it, or disable the bundled DB with postgresql.enabled=false and use a managed Postgres." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.service.name }}
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.auth.password | quote }}
