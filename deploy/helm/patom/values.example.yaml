# Self-hosted install example (issue #84).
#
# Supplies the `patom-config` Secret directly from values via the plain Secret
# path, so the chart renders and runs with NO External Secrets Operator and NO
# OpenBao CRDs in the cluster:
#
#   helm install patom deploy/helm/patom -f deploy/helm/patom/values.example.yaml
#
# Replace every CHANGE_ME before installing. For production secret hygiene, supply
# real values with `--set-file secret.data.<KEY>=...` or your own tooling rather
# than committing them here. Generate strong randoms, e.g.:
#   PATOM_JWT_SECRET : openssl rand -base64 48
#   PATOM_MASTER_KEK : openssl rand -base64 32   (decodes to 32 raw bytes)

# Turn off the OpenBao/ESO path; turn on the plain Secret path. Exactly one of the
# two must be set — enabling both (or neither) fails `helm template` by design.
externalSecret:
  enabled: false

secret:
  create: true
  data:
    # --- required ---
    # Postgres DSN. With the bundled `postgresql` subchart (default, below) the
    # host is its Service patom-postgres:5432 and the password here MUST match
    # postgresql.auth.password. For a managed Postgres instead, set this DSN to
    # your instance and disable the bundled DB (see the `postgresql:` block below).
    DATABASE_URL: "postgres://patom:CHANGE_ME@patom-postgres:5432/patom"
    PATOM_JWT_SECRET: "CHANGE_ME_min_32_bytes_random"        # HS256 session signing key, >= 32 bytes
    PATOM_MASTER_KEK: "CHANGE_ME_base64_32_bytes"            # envelope key for stored MCP creds; base64 of 32 bytes
    BRAVE_SEARCH_API_KEY: "CHANGE_ME"
    EMBEDDING_API_KEY: "CHANGE_ME"                           # paired with env.EMBEDDING_MODEL/EMBEDDING_BASE_URL
    # GitHub OAuth app (required — GitHub has no RFC 7591 dynamic registration).
    PATOM_GITHUB_CLIENT_ID: "CHANGE_ME"
    PATOM_GITHUB_CLIENT_SECRET: "CHANGE_ME"
    # At least ONE LLM provider key (must match env.MODEL / *_BASE_URL):
    DEEPSEEK_API_KEY: "CHANGE_ME"
    # ANTHROPIC_API_KEY: "CHANGE_ME"
    # OPENAI_API_KEY: "CHANGE_ME"
    # Login: OIDC (required). Point ISSUER at any OIDC IdP (Google, Keycloak,
    # Okta, Entra, …); REDIRECT_URL is "{public-url}/auth/oidc/callback" and must
    # be registered with that IdP. For Google use ISSUER https://accounts.google.com.
    PATOM_OIDC_ISSUER: "https://accounts.google.com"
    PATOM_OIDC_CLIENT_ID: "CHANGE_ME"
    PATOM_OIDC_CLIENT_SECRET: "CHANGE_ME"
    PATOM_OIDC_REDIRECT_URL: "https://patom.example.com/auth/oidc/callback"

    # --- optional groups (uncomment the whole group to enable) ---
    # Slack (inbound webhook + OAuth):
    # PATOM_SLACK_SIGNING_SECRET: "CHANGE_ME"
    # PATOM_SLACK_CLIENT_SECRET: "CHANGE_ME"
    # S3-compatible object storage — MinIO / AWS / self-hosted / R2. ALL-OR-NOTHING:
    # to enable uploads you must set BOTH this secret trio AND the non-secret trio
    # (PATOM_S3_PUBLIC_HOST / _BUCKET / _REGION) in the `env:` block below — a
    # partial set fails config parse. Leave all of it commented to run with uploads
    # disabled (endpoints 503). Endpoint is grouped with the credentials because the
    # R2 form embeds the account id; for MinIO/AWS it's just the API URL.
    # PATOM_S3_ENDPOINT: "CHANGE_ME"            # e.g. http://minio:9000 or https://<acct>.r2.cloudflarestorage.com
    # PATOM_S3_ACCESS_KEY_ID: "CHANGE_ME"
    # PATOM_S3_SECRET_ACCESS_KEY: "CHANGE_ME"
    # Transactional email — SMTP relay for member-invite mail. ALL-OR-NOTHING:
    # to enable, set this secret (the relay password / API key) AND the non-secret
    # group (PATOM_SMTP_HOST / _USERNAME / PATOM_EMAIL_FROM) in `env` below. Leave
    # all of it commented to log invite links instead of mailing them (LogMailer).
    # Resend example: host smtp.resend.com, username "resend", password = API key.
    # PATOM_SMTP_PASSWORD: "CHANGE_ME"          # relay password / API key (e.g. Resend re_...)
    # Telemetry exporter credentials (see the `env:` observability block below for
    # the full on-cluster opt-in). Leave all three commented to stay console-only:
    # with no backend keys set the app exports NOTHING off-cluster (stderr logs
    # only). Honeycomb needs just the API key (a local collector ignores its value);
    # Langfuse needs both keys. Pair these with the *_BASE_URL overrides under `env`
    # so traces go to YOUR in-cluster collector, not a vendor cloud.
    # HONEYCOMB_API_KEY: "CHANGE_ME"
    # LANGFUSE_PUBLIC_KEY: "CHANGE_ME"
    # LANGFUSE_SECRET_KEY: "CHANGE_ME"
    # PostHog product analytics — injected into index.html at startup; no build step.
    # Leave unset (default) for the hard no-op / OSS / self-host case.
    # PATOM_POSTHOG_KEY: "phc_CHANGE_ME"
    # PATOM_POSTHOG_HOST: "https://eu.i.posthog.com"   # EU endpoint (default)
    # Per-vendor MCP OAuth clients (one ID/SECRET pair per vendor, e.g. MICROSOFT_365):
    # PATOM_MICROSOFT_365_CLIENT_ID: "CHANGE_ME"
    # PATOM_MICROSOFT_365_CLIENT_SECRET: "CHANGE_ME"

# --- Database ---
# Bundled standalone Postgres (pgvector), ON by default: one-command app + DB.
# Single replica, no backups/HA — for evaluation / small self-hosts. The password
# here MUST match the one in DATABASE_URL above.
postgresql:
  enabled: true
  auth:
    password: "CHANGE_ME"   # must equal the password in DATABASE_URL
  persistence:
    size: 10Gi
    storageClass: ""        # "" → cluster default StorageClass; set if you have none
#
# PRODUCTION: prefer your own managed pgvector Postgres. Comment out the block
# above (or set enabled:false), set DATABASE_URL to your instance, and ensure the
# pgvector extension is available there. You then own backups/HA for that DB.
#   postgresql:
#     enabled: false

# Point the app at your own domain. This single `host` value drives the ingress
# AND the app's redirect/web-base URLs (derived as https://<host>). Defaults are
# single-origin: host-only cookies, no CORS — leave the `app` block untouched
# unless you serve the app across multiple hostnames. See
# doc/operations/self-hosting.md for DNS + TLS prerequisites.
ingress:
  host: patom.example.com
  tls:
    # Choose ONE TLS source:
    #   cert-manager    — needs cert-manager + a ClusterIssuer; it issues/renews.
    mode: cert-manager
    clusterIssuer: letsencrypt-prod
    #   existing-secret — pre-create the TLS Secret yourself, then:
    #     mode: existing-secret
    #     secretName: my-tls   # kubectl create secret tls my-tls --cert=... --key=...
    #   none            — TLS terminated upstream (cloud LB / edge):
    #     mode: none

# Cross-subdomain cookie/CORS — OFF by default (single-origin). Set these only if
# the app and a sibling site share cookies / call each other across hostnames:
# app:
#   cookieDomain: ".example.com"
#   corsAllowedOrigins: ["https://www.example.com"]

# --- Observability / telemetry (issue #88) ---
# Private by default: the chart ships PATOM_GENAI_CAPTURE_CONTENT=0 (no prompt or
# response content is recorded) and, with the telemetry keys in secret.data left
# commented, the app runs console-only — NOTHING leaves the cluster.
#
# To opt in (observability and/or S3 uploads), uncomment this `env:` block. These
# keys merge over the chart defaults (values.yaml). Keep every endpoint in-cluster
# so prompt content never reaches a vendor cloud. See doc/operations/self-hosting.md.
# env:
#   # Record prompt/response content onto spans + stderr (off by default).
#   PATOM_GENAI_CAPTURE_CONTENT: "1"
#   # Send traces to YOUR collector, not the vendor cloud. The app appends
#   # /v1/traces automatically. Pick the backend whose keys you set in secret.data:
#   #   OTel Collector (OTLP/HTTP) via the Honeycomb path — key value is ignored:
#   HONEYCOMB_BASE_URL: "http://otel-collector.patom.svc:4318"
#   #   …or self-hosted Langfuse via the Langfuse path:
#   # LANGFUSE_BASE_URL: "http://langfuse-web.patom.svc:3000/api/public/otel"
#   # S3 object storage — the NON-SECRET trio. Set these together with the secret
#   # trio in secret.data above (all-or-nothing). PUBLIC_HOST is the browser-facing
#   # base URL assets are served from; REGION is "us-east-1" if omitted.
#   PATOM_S3_PUBLIC_HOST: "https://assets.example.com"   # or http://minio.patom.svc:9000/patom
#   PATOM_S3_BUCKET: "patom"
#   PATOM_S3_REGION: "us-east-1"
#   # Transactional email — the NON-SECRET group. Set together with
#   # PATOM_SMTP_PASSWORD in secret.data above (all-or-nothing). The mailer always
#   # uses STARTTLS submission; PORT defaults to 587 (override only for a relay on a
#   # non-standard STARTTLS port). EMAIL_FROM must be a verified sender on the relay.
#   # Resend: HOST smtp.resend.com, USERNAME "resend".
#   PATOM_SMTP_HOST: "smtp.resend.com"
#   PATOM_SMTP_USERNAME: "resend"
#   # PATOM_SMTP_PORT: "587"
#   PATOM_EMAIL_FROM: "invites@patom.example.com"
#   PATOM_EMAIL_FROM_NAME: "Patom"
