# Self-hosted install example (issue #84).
#
# Supplies the `patom-config` Secret directly from values via the plain Secret
# path, so the chart renders and runs with NO External Secrets Operator and NO
# OpenBao CRDs in the cluster:
#
#   helm install patom deploy/helm/patom -f deploy/helm/patom/values.example.yaml
#
# Replace every CHANGE_ME before installing. For production secret hygiene, supply
# real values with `--set-file secret.data.<KEY>=...` or your own tooling rather
# than committing them here. Generate strong randoms, e.g.:
#   PATOM_JWT_SECRET : openssl rand -base64 48
#   PATOM_MASTER_KEK : openssl rand -base64 32   (decodes to 32 raw bytes)

# Turn off the OpenBao/ESO path; turn on the plain Secret path. Exactly one of the
# two must be set — enabling both (or neither) fails `helm template` by design.
externalSecret:
  enabled: false

secret:
  create: true
  data:
    # --- required ---
    # Postgres DSN. Host matches the sibling `postgres` chart's Service
    # (postgres.serviceName / .port in values.yaml: patom-postgres:5432).
    DATABASE_URL: "postgres://patom:CHANGE_ME@patom-postgres:5432/patom"
    PATOM_JWT_SECRET: "CHANGE_ME_min_32_bytes_random"        # HS256 session signing key, >= 32 bytes
    PATOM_MASTER_KEK: "CHANGE_ME_base64_32_bytes"            # envelope key for stored MCP creds; base64 of 32 bytes
    BRAVE_SEARCH_API_KEY: "CHANGE_ME"
    EMBEDDING_API_KEY: "CHANGE_ME"                           # paired with env.EMBEDDING_MODEL/EMBEDDING_BASE_URL
    # GitHub OAuth app (required — GitHub has no RFC 7591 dynamic registration).
    PATOM_GITHUB_CLIENT_ID: "CHANGE_ME"
    PATOM_GITHUB_CLIENT_SECRET: "CHANGE_ME"
    # At least ONE LLM provider key (must match env.MODEL / *_BASE_URL):
    DEEPSEEK_API_KEY: "CHANGE_ME"
    # ANTHROPIC_API_KEY: "CHANGE_ME"
    # OPENAI_API_KEY: "CHANGE_ME"
    # Login: Google preset (default). For generic OIDC instead, drop these two,
    # set PATOM_OIDC_CLIENT_ID / PATOM_OIDC_CLIENT_SECRET here and
    # PATOM_OIDC_ISSUER / PATOM_OIDC_REDIRECT_URL under `env`.
    GOOGLE_CLIENT_ID: "CHANGE_ME"
    GOOGLE_CLIENT_SECRET: "CHANGE_ME"

    # --- optional groups (uncomment the whole group to enable) ---
    # Slack (inbound webhook + OAuth):
    # PATOM_SLACK_SIGNING_SECRET: "CHANGE_ME"
    # PATOM_SLACK_CLIENT_SECRET: "CHANGE_ME"
    # Cloudflare R2 object storage (pair with env.PATOM_R2_PUBLIC_HOST/PATOM_R2_BUCKET):
    # PATOM_R2_ACCOUNT_ID: "CHANGE_ME"
    # PATOM_R2_ACCESS_KEY_ID: "CHANGE_ME"
    # PATOM_R2_SECRET_ACCESS_KEY: "CHANGE_ME"
    # Telemetry exporters:
    # HONEYCOMB_API_KEY: "CHANGE_ME"
    # LANGFUSE_PUBLIC_KEY: "CHANGE_ME"
    # LANGFUSE_SECRET_KEY: "CHANGE_ME"
    # Per-vendor MCP OAuth clients (one ID/SECRET pair per vendor, e.g. MICROSOFT_365):
    # PATOM_MICROSOFT_365_CLIENT_ID: "CHANGE_ME"
    # PATOM_MICROSOFT_365_CLIENT_SECRET: "CHANGE_ME"

# Point the app at your own hostname (cert-manager issues TLS for this host).
# ingress:
#   host: patom.example.com
#   clusterIssuer: letsencrypt-prod
