{{- if .Values.backup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: patom-postgres-backup
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgres
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
          containers:
            - name: backup
              image: "{{ .Values.backup.image }}:{{ .Values.backup.imageTag }}"
              envFrom:
                - secretRef:
                    name: patom-postgres-backup
              env:
                - name: PGHOST
                  value: {{ .Values.service.name }}
                - name: PGUSER
                  value: {{ .Values.user | quote }}
                - name: PGDATABASE
                  value: {{ .Values.database | quote }}
                - name: PREFIX
                  value: {{ .Values.backup.r2.prefix | quote }}
                # Dedicated PRIVATE backup bucket from chart values (NOT the public
                # avatar bucket). R2_ACCOUNT_ID + AWS_* keys come from the Secret.
                - name: R2_BUCKET
                  value: {{ .Values.backup.r2.bucket | quote }}
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  ts="$(date -u +%Y%m%dT%H%M%SZ)"
                  file="/tmp/${PGDATABASE}_${ts}.dump"
                  echo "dumping ${PGDATABASE} -> ${file}"
                  pg_dump -Fc -f "${file}"
                  endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
                  echo "uploading to s3://${R2_BUCKET}/${PREFIX}/"
                  aws --endpoint-url "${endpoint}" s3 cp \
                    "${file}" "s3://${R2_BUCKET}/${PREFIX}/${PGDATABASE}_${ts}.dump"
                  echo "backup complete"
              resources:
                {{- toYaml .Values.backup.resources | nindent 16 }}
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
{{- end }}
