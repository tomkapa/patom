# POSTGRES_PASSWORD for the StatefulSet. Decoupled from the app's patom-config
# Secret so Postgres (sync-wave -2) doesn't wait on the app's ExternalSecret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: patom-postgres
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
spec:
  # 1m so an OpenBao change is reflected within a minute rather than up to
  # an hour (matches the patom chart; keeps backup creds + DB password fresh).
  refreshInterval: 1m
  secretStoreRef:
    name: {{ .Values.externalSecret.storeRef }}
    kind: ClusterSecretStore
  target:
    name: patom-postgres
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecret.remoteKey }}
        property: POSTGRES_PASSWORD
{{- if .Values.backup.enabled }}
---
# S3 CREDENTIALS ONLY for the backup CronJob. We reuse the same S3 endpoint + access
# keys already provisioned for avatars, but ONLY the endpoint + keys — never the
# bucket name. The avatar bucket (PATOM_S3_BUCKET) is PUBLIC-READ; writing DB dumps
# (tenant data + MASTER_KEK-encrypted secrets) there would expose them. The backup
# bucket is a SEPARATE, PRIVATE bucket named in chart values (.Values.backup.s3.bucket).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: patom-postgres-backup
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
spec:
  # 1m so an OpenBao change is reflected within a minute rather than up to
  # an hour (matches the patom chart; keeps backup creds + DB password fresh).
  refreshInterval: 1m
  secretStoreRef:
    name: {{ .Values.externalSecret.storeRef }}
    kind: ClusterSecretStore
  target:
    name: patom-postgres-backup
    creationPolicy: Owner
  data:
    - secretKey: PGPASSWORD
      remoteRef: { key: {{ .Values.externalSecret.remoteKey }}, property: POSTGRES_PASSWORD }
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef: { key: {{ .Values.externalSecret.remoteKey }}, property: PATOM_S3_ACCESS_KEY_ID }
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef: { key: {{ .Values.externalSecret.remoteKey }}, property: PATOM_S3_SECRET_ACCESS_KEY }
    - secretKey: S3_ENDPOINT
      remoteRef: { key: {{ .Values.externalSecret.remoteKey }}, property: PATOM_S3_ENDPOINT }
{{- end }}
