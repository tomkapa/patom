# POSTGRES_PASSWORD for the StatefulSet. Decoupled from the app's patom-config
# Secret so Postgres (sync-wave -2) doesn't wait on the app's ExternalSecret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: patom-postgres
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecret.storeRef }}
    kind: ClusterSecretStore
  target:
    name: patom-postgres
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecret.remoteKey }}
        property: POSTGRES_PASSWORD
{{- if .Values.backup.enabled }}
---
# R2 CREDENTIALS ONLY for the backup CronJob. We reuse the same R2 account + access
# keys already provisioned for avatars, but ONLY the account id + keys — never the
# bucket name. The avatar bucket (PATOM_R2_BUCKET) is PUBLIC-READ; writing DB dumps
# (tenant data + MASTER_KEK-encrypted secrets) there would expose them. The backup
# bucket is a SEPARATE, PRIVATE bucket named in chart values (.Values.backup.r2.bucket).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: patom-postgres-backup
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecret.storeRef }}
    kind: ClusterSecretStore
  target:
    name: patom-postgres-backup
    creationPolicy: Owner
  data:
    - secretKey: PGPASSWORD
      remoteRef: { key: {{ .Values.externalSecret.remoteKey }}, property: POSTGRES_PASSWORD }
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef: { key: {{ .Values.externalSecret.remoteKey }}, property: PATOM_R2_ACCESS_KEY_ID }
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef: { key: {{ .Values.externalSecret.remoteKey }}, property: PATOM_R2_SECRET_ACCESS_KEY }
    - secretKey: R2_ACCOUNT_ID
      remoteRef: { key: {{ .Values.externalSecret.remoteKey }}, property: PATOM_R2_ACCOUNT_ID }
{{- end }}
