# Headless Service — stable DNS patom-postgres.<ns>.svc for the app's DATABASE_URL.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.name }}
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "postgres.selectorLabels" . | nindent 4 }}
  ports:
    - name: postgres
      port: {{ .Values.service.port }}
      targetPort: postgres
{{- if .Values.adminAccess.enabled }}
---
# Admin Service — a NORMAL ClusterIP (not headless) so it has a stable, routable
# IP (10.43.x.x). Reachable from a workstation over the Tailscale subnet route
# (advertise the service CIDR on the node). The headless service above can't be
# routed to (clusterIP: None = no IP). Pair with the adminAccess NetworkPolicy.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.name }}-admin
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin
spec:
  type: ClusterIP
  selector:
    {{- include "postgres.selectorLabels" . | nindent 4 }}
  ports:
    - name: postgres
      port: {{ .Values.service.port }}
      targetPort: postgres
{{- end }}
