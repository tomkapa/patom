# cargo-deny configuration — the supply-chain gate of CLAUDE.md §8,
# enforced by .github/workflows/ci.yml. See https://embarkstudios.github.io/cargo-deny/

[licenses]
# Permissive licenses actually present in the dependency tree (enumerate with
# `cargo deny list`). Note what is *deliberately absent*:
#   - LGPL-2.1-or-later: only `r-efi`, whose SPDX is
#     "MIT OR Apache-2.0 OR LGPL-2.1-or-later" — it resolves via the MIT/Apache
#     arm (and is not compiled on our targets), so we never accept LGPL terms.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# The workspace crate itself is LicenseRef-FSL-1.1-Apache-2.0 (source-available,
# not OSI-approved). This gate governs *third-party* licenses, so skip
# first-party / unpublished workspace crates.
private = { ignore = true }

[advisories]
# Build-graph advisories with no actionable fix. cargo-deny scans the compiled
# graph; rationale for each ignore is mirrored in `.cargo/audit.toml`.
ignore = [
    # `rsa` "Marvin" timing sidechannel (RUSTSEC-2023-0071). Now compiled into
    # the graph via `openidconnect` -> `rsa` (RS256 id_token signature
    # verification, ADR-0011). The advisory is a *private-key* recovery
    # sidechannel during signing/decryption; our only use is *public-key*
    # verification of IdP-issued id_tokens — we never hold or operate on an RSA
    # private key, so the leak does not apply. No fixed `rsa` release exists
    # upstream. Re-evaluate when RustCrypto ships the constant-time rewrite.
    "RUSTSEC-2023-0071",
    # `backoff` unmaintained. Dev-only: pulled by `async-openai`, a
    # dev-dependency — never in the shipped binary.
    "RUSTSEC-2025-0012",
    # `instant` unmaintained. Dev-only: `backoff` -> `async-openai` (dev-dep).
    "RUSTSEC-2024-0384",
]

[bans]
# Duplicate transitive versions are a warning, not a hard failure.
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
