# cargo-audit configuration — the §8 supply-chain gate that scans Cargo.lock.
# cargo-audit reads every lockfile entry (even uncompiled ones), so it is the
# superset of cargo-deny's build-graph advisory check; rationale for each
# ignore mirrors deny.toml.
[advisories]
ignore = [
    # rsa "Marvin" timing sidechannel. Compiled into the graph via
    # `openidconnect` -> `rsa` for RS256 id_token signature verification
    # (ADR-0011). The advisory leaks an RSA *private key* during private-key
    # ops; we only do *public-key* verification of IdP id_tokens and never hold
    # a private key, so it does not apply. No fixed release exists upstream.
    "RUSTSEC-2023-0071",
    # `backoff` unmaintained. Dev-only: via `async-openai` (a dev-dependency).
    "RUSTSEC-2025-0012",
    # `instant` unmaintained. Dev-only: `backoff` -> `async-openai` (dev-dep).
    "RUSTSEC-2024-0384",
]
