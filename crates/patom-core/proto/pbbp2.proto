// pbbp2 — the protobuf frame format of Lark's long-connection (WebSocket)
// transport. Reference documentation ONLY: the wire types are hand-written as
// `prost` structs in `src/lark/pbbp2.rs` (no `prost-build`/`protoc` step), so
// this file is not compiled. Transcribed verbatim from the field tags in the
// official Go SDK `larksuite/oapi-sdk-go` (`ws/pbbp2.pb.go`, branch `v3_main`).
//
// Frame.method: 0 = Control (ping/pong), 1 = Data (event/card delivery + ACK).
// Headers carry the semantics: `type` (event|card|ping|pong), `message_id`,
// `sum` (fragment count, 1 if unfragmented), `seq` (fragment index), `trace_id`,
// `timestamp`, `biz_rt`, `Handshake-Status`. The ACK is a Frame whose `payload`
// is a JSON `{"code":0,...}` (code 0 == OK).

syntax = "proto3";

package pbbp2;

message Header {
  string key = 1;
  string value = 2;
}

message Frame {
  uint64 seq_id = 1;
  uint64 log_id = 2;
  int32 service = 3;
  int32 method = 4;
  repeated Header headers = 5;
  string payload_encoding = 6;
  string payload_type = 7;
  bytes payload = 8;
  string log_id_new = 9;
}
