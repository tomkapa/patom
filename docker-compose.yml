services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: patom-postgres
    environment:
      POSTGRES_USER: patom
      POSTGRES_PASSWORD: patom
      POSTGRES_DB: patom
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patom -d patom"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - patom_pg_data:/var/lib/postgresql/data
      # Provision the cluster-global `patom_app` role on first cluster init so
      # concurrent `#[sqlx::test]` runs don't race on the tenancy migration's
      # CREATE ROLE. Runs once when the data volume is empty; see ci/init-roles.sql.
      - ./ci/init-roles.sql:/docker-entrypoint-initdb.d/00-roles.sql:ro

volumes:
  patom_pg_data:
