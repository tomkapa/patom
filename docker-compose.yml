services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: patom-postgres
    environment:
      POSTGRES_USER: patom
      POSTGRES_PASSWORD: patom
      POSTGRES_DB: patom
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patom -d patom"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - patom_pg_data:/var/lib/postgresql/data

volumes:
  patom_pg_data:
